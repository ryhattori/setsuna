[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "setsuna"
version = "0.1.0"
description = "SETSUNA: spike inference with temporal super-resolution for calcium imaging"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ryoma Hattori" }]
license = { text = "GPL-3.0-or-later" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.23", "scipy>=1.10", "torch>=2.2", "numba>=0.57"]

[project.scripts]
setsuna = "setsuna.cli:main"

[tool.setuptools.packages.find]
include = ["setsuna*"]

[tool.setuptools.package-data]
setsuna = ["*.json", "_vendor/*.py"]
